name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      # Step conditions can't read secrets, e.g. no mirror on forks
      HAS_MAVEN_MIRROR: ${{ secrets.MAVEN_MIRROR_URL != '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        project: [maven, gradle]
        # Adds the build command to each os / project combination
        include:
          - project: maven
            command: ./mvnw --batch-mode verify
          - project: gradle
            command: ./gradlew build
    defaults:
      run:
        # Git Bash on Windows
        shell: bash
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          # Log downloads, to show they come from the mirror
          show-download-progress: true

      # Proves the builds below don't bypass the mirror
      - if: ${{ env.HAS_MAVEN_MIRROR == 'true' }}
        uses: ./.github/actions/blackhole-maven-central

      - if: ${{ env.HAS_MAVEN_MIRROR == 'true' }}
        uses: ./.github/actions/maven-central-mirror
        with:
          url: ${{ secrets.MAVEN_MIRROR_URL }}
          username: ${{ secrets.MAVEN_MIRROR_USERNAME }}
          password: ${{ secrets.MAVEN_MIRROR_PASSWORD }}

      - if: runner.os != 'Windows'
        run: ${{ matrix.command }}

      # Native shell on Windows, so mvnw.cmd / gradlew.bat run, like for Windows users
      - if: runner.os == 'Windows'
        run: ${{ matrix.command }}
        shell: pwsh
