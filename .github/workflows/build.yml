name: Build

on:
  push:
  pull_request:

env:
  # Hostnames serving Maven Central
  MAVEN_CENTRAL_HOSTS: repo.maven.apache.org repo1.maven.org

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        project: [maven, gradle]
        # Adds the build command to each os / project combination
        include:
          - project: maven
            command: ./mvnw --batch-mode verify
          - project: gradle
            command: ./gradlew build
    defaults:
      run:
        # Git Bash on Windows
        shell: bash
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          # Log downloads, to show they come from the mirror
          show-download-progress: true

      # Resolve Maven Central to unroutable addresses (IPv4 + IPv6), so any access fails fast
      - name: Blackhole Maven Central
        run: |
          # Windows has no sudo, the runner user is an administrator already
          hosts=/etc/hosts
          as_admin() { sudo "$@"; }
          if [ "$RUNNER_OS" = Windows ]; then
            hosts="$SYSTEMROOT/System32/drivers/etc/hosts"
            as_admin() { "$@"; }
          fi

          # Leading newline, in case the file doesn't end with one
          {
            echo
            for host in $MAVEN_CENTRAL_HOSTS; do
              printf '0.0.0.0 %s\n:: %s\n' "$host" "$host"
            done
          } | as_admin tee -a "$hosts"

          # Drop cached Central addresses (macOS: mDNSResponder, Windows: DNS Client service)
          case "$RUNNER_OS" in
            macOS)
              sudo dscacheutil -flushcache
              sudo killall -HUP mDNSResponder
              ;;
            Windows)
              # Keep Git Bash from turning /flushdns into a path
              MSYS_NO_PATHCONV=1 ipconfig /flushdns
              ;;
          esac

      # Fail if the blackhole doesn't work
      - name: Verify Maven Central is unreachable
        run: |
          for host in $MAVEN_CENTRAL_HOSTS; do
            if curl --silent --max-time 10 "https://$host/maven2/" > /dev/null; then
              echo "::error::$host is still reachable"
              exit 1
            fi
          done

      - uses: ./.github/actions/maven-central-mirror
        with:
          url: ${{ secrets.MAVEN_MIRROR_URL }}
          username: ${{ secrets.MAVEN_MIRROR_USERNAME }}
          password: ${{ secrets.MAVEN_MIRROR_PASSWORD }}

      - if: runner.os != 'Windows'
        run: ${{ matrix.command }}

      # Native shell on Windows, so mvnw.cmd / gradlew.bat run, like for Windows users
      - if: runner.os == 'Windows'
        run: ${{ matrix.command }}
        shell: pwsh
