name: Build

on:
  push:
  pull_request:

env:
  # Hostnames serving Maven Central
  MAVEN_CENTRAL_HOSTS: repo.maven.apache.org repo1.maven.org

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: maven
            command: ./mvnw --batch-mode --settings .mvn/settings.xml verify
          - project: gradle
            command: ./gradlew build
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    # Mirror config for every build in the job (Maven: settings.xml + MVNW_*, Gradle: init script)
    env:
      MAVEN_MIRROR_URL: ${{ secrets.MAVEN_MIRROR_URL }}
      MAVEN_MIRROR_USERNAME: ${{ secrets.MAVEN_MIRROR_USERNAME }}
      MAVEN_MIRROR_PASSWORD: ${{ secrets.MAVEN_MIRROR_PASSWORD }}
      MVNW_REPOURL: ${{ secrets.MAVEN_MIRROR_URL }}
      MVNW_USERNAME: ${{ secrets.MAVEN_MIRROR_USERNAME }}
      MVNW_PASSWORD: ${{ secrets.MAVEN_MIRROR_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          # Log downloads, to show they come from the mirror
          show-download-progress: true

      # Resolve Maven Central to unroutable addresses (IPv4 + IPv6), so any access fails fast
      - name: Blackhole Maven Central
        run: |
          for host in $MAVEN_CENTRAL_HOSTS; do
            printf '0.0.0.0 %s\n:: %s\n' "$host" "$host" | sudo tee -a /etc/hosts
          done

      # Fail if the blackhole doesn't work
      - name: Verify Maven Central is unreachable
        run: |
          for host in $MAVEN_CENTRAL_HOSTS; do
            if curl --silent --max-time 10 "https://$host/maven2/" > /dev/null; then
              echo "::error::$host is still reachable"
              exit 1
            fi
          done

      # Gradle applies every *.init.gradle in $GRADLE_USER_HOME/init.d, so builds need no -I flag
      - name: Install Gradle mirror init script
        working-directory: .
        run: |
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_dir"
          cp .github/mirror/maven-mirror.init.gradle "$init_dir/"

      # Gradle's distribution comes from services.gradle.org, not via the mirror
      - run: ${{ matrix.command }}
